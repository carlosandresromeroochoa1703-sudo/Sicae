<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generando credenciales - SICAE WEB</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}
        main{width:min(480px,calc(100% - 40px));box-sizing:border-box;padding:30px;background:white;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 32px #0f172a12;text-align:center}
        .spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #dbeafe;border-top-color:#1d4ed8;border-radius:50%;animation:girar .8s linear infinite}
        h1{font-size:22px;margin:0 0 10px}p{color:#475569;line-height:1.5;margin:0 0 18px}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:8px;overflow-wrap:anywhere}
        progress{width:100%;height:14px;margin:0 0 12px;accent-color:#1d4ed8}#progressText{font-size:13px;color:#64748b;margin-bottom:16px}
        a{display:inline-block;margin-top:14px;padding:10px 15px;border-radius:8px;background:#1e3a8a;color:white;text-decoration:none;font-weight:bold}
        @keyframes girar{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <main>
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <h1 id="title">Preparando tus credenciales</h1>
        <p id="message" role="status">Estamos generando el PDF. Esta página te llevará a la descarga cuando termine.</p>
        <progress id="progress" max="100" value="0"></progress>
        <p id="progressText">Preparando archivo…</p>
        <a id="back" href="/credencial/imprimir" hidden>Volver a credenciales</a>
    </main>
    <script>
        const statusUrl = "/credenciales/generacion/{{ job_id }}/estado";
        const title = document.getElementById("title");
        const message = document.getElementById("message");
        const spinner = document.getElementById("spinner");
        const progress = document.getElementById("progress");
        const progressText = document.getElementById("progressText");
        const back = document.getElementById("back");
        let fallosDeConexion = 0;
        function mostrarError(texto) {
            spinner.hidden = true;
            progress.hidden = true;
            progressText.hidden = true;
            title.textContent = "No se pudo generar el PDF";
            message.textContent = texto || "Ocurrió un error durante la generación.";
            message.className = "error";
            back.hidden = false;
        }
        async function checkStatus() {
            try {
                const response = await fetch(statusUrl, {cache: "no-store"});
                const result = await response.json().catch(() => ({}));
                fallosDeConexion = 0;
                if (!response.ok) {
                    mostrarError(result.mensaje || "El servidor no pudo consultar el estado de la generación.");
                    return;
                }
                if (result.estado === "listo") {
                    title.textContent = "Credenciales listas";
                    message.textContent = "Abriendo el PDF…";
                    progress.value = 100;
                    progressText.textContent = "PDF listo";
                    window.location.replace(result.descarga);
                    return;
                }
                if (result.estado === "error") {
                    mostrarError(result.mensaje);
                    return;
                }
                if (result.estado !== "generando") {
                    mostrarError(result.mensaje || "El servidor perdió el seguimiento de esta generación. Inicia una nueva descarga.");
                    return;
                }
                const total = Number(result.total || 0);
                const completadas = Number(result.completadas || 0);
                const porcentaje = total > 0 ? Math.floor(completadas * 100 / total) : 0;
                progress.value = porcentaje;
                progressText.textContent = total > 0
                    ? `Credenciales procesadas: ${completadas} de ${total} (${porcentaje}%)`
                    : "Preparando archivo…";
                message.textContent = total > 0 && completadas === total
                    ? "Finalizando el PDF…"
                    : "Estamos generando el PDF. Esta página te llevará a la descarga cuando termine.";
            } catch (error) {
                fallosDeConexion++;
                if (fallosDeConexion >= 10) {
                    mostrarError("No hay respuesta del servidor. Recarga e intenta generar las credenciales de nuevo.");
                    return;
                }
                message.textContent = "Reconectando con el servidor…";
            }
            window.setTimeout(checkStatus, 1800);
        }
        checkStatus();
    </script>
</body>
</html>
