<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Información - SICAE WEB
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .contenedor {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .tarjeta {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #1f4e79;
        }

        .dato {
            margin: 20px 0;
            padding: 15px;
            background: #f7f9fb;
            border-radius: 10px;
        }

        .dato strong {
            display: block;
            margin-bottom: 5px;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .volver:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <h1>
                Información de SICAE WEB
            </h1>

            <div class="dato">

                <strong>
                    Sistema
                </strong>

                Sistema Integral de Control y Asistencia Escolar

            </div>

            <div class="dato">

                <strong>
                    Versión
                </strong>

                1.0.0

            </div>

            <div class="dato">

                <strong>
                    Plataforma
                </strong>

                SICAE WEB

            </div>

            <div class="dato">

                <strong>
                    Función principal
                </strong>

                Gestión de alumnos, grupos, usuarios,
                asistencia mediante códigos QR y credenciales.

            </div>

            <a
                href="/administracion"
                class="volver"
            >
                ← Volver a Administración
            </a>

        </div>

    </div>

    <script src="/static/js/navigation.js"></script>
</body>

</html>
